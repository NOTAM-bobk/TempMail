<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burner Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent2: #c084fc;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --green: #4ade80;
    --red: #f87171;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo span { font-weight: 400; opacity: 0.5; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 3px rgba(107,107,128,0.2);
    transition: all 0.4s;
  }
  .status-dot.live {
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(74,222,128,0.2);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.2); }
    50% { box-shadow: 0 0 0 6px rgba(74,222,128,0.05); }
  }

  /* Main layout */
  main {
    flex: 1;
    display: grid;
    grid-template-rows: auto 1fr;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 20px;
    gap: 24px;
  }

  /* Address card */
  .address-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    position: relative;
    overflow: hidden;
  }

  .address-card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(124,106,247,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .card-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .address-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .email-address {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .email-address.generating {
    color: var(--muted);
    font-style: italic;
    font-size: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,106,247,0.06); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6457d4);
    border-color: transparent;
    color: #fff;
    font-weight: 500;
  }
  .btn-primary:hover { filter: brightness(1.1); color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent), #6457d4); }

  .address-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  /* Inbox */
  .inbox-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 380px;
  }

  .inbox-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
  }

  .inbox-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    background: var(--accent);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 10px;
    display: none;
  }
  .badge.visible { display: inline-block; }

  .refresh-info {
    font-size: 11px;
    color: var(--muted);
  }

  /* Message list */
  .message-list {
    flex: 1;
    overflow-y: auto;
  }

  .message-list::-webkit-scrollbar { width: 4px; }
  .message-list::-webkit-scrollbar-track { background: transparent; }
  .message-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: 240px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 40px;
    opacity: 0.3;
  }

  .empty-state p { font-size: 13px; text-align: center; }

  .message-item {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 16px;
    align-items: start;
  }
  .message-item:last-child { border-bottom: none; }
  .message-item:hover { background: var(--surface2); }
  .message-item.unread { border-left: 3px solid var(--accent); }

  .msg-from {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .message-item.unread .msg-from { color: #fff; }

  .msg-subject {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .message-item.unread .msg-subject { color: var(--text); }

  .msg-time {
    font-size: 11px;
    color: var(--muted);
    grid-row: 1;
    text-align: right;
    white-space: nowrap;
  }

  /* Message viewer */
  .message-viewer {
    display: none;
    flex-direction: column;
    height: 100%;
  }
  .message-viewer.active {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    padding: 0;
  }

  .viewer-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    sticky: top 0;
  }

  .viewer-meta {
    flex: 1;
    min-width: 0;
  }

  .viewer-subject {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .viewer-from {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .viewer-body {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
  }

  .viewer-body iframe {
    width: 100%;
    border: none;
    min-height: 300px;
    background: white;
    border-radius: 8px;
  }

  .viewer-body pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 500px) {
    main { padding: 16px 12px; }
    .address-card { padding: 20px 16px; }
    .email-address { font-size: 14px; }
    .inbox-header { padding: 14px 16px; }
    .message-item { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Burner<span>Mail</span></div>
    <div class="status-dot" id="statusDot"></div>
  </header>

  <main>
    <!-- Address Card -->
    <div class="address-card">
      <div class="card-label">Your temporary address</div>
      <div class="address-row">
        <div class="email-address generating" id="emailDisplay">
          <span class="spinner"></span>&nbsp; generating address...
        </div>
      </div>
      <div class="address-actions">
        <button class="btn btn-primary" id="copyBtn" onclick="copyAddress()" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy address
        </button>
        <button class="btn" id="newBtn" onclick="createNewAddress()" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 11-2.1-4.3L23 10"/></svg>
          New address
        </button>
        <button class="btn" id="refreshBtn" onclick="refreshInbox()" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 102.8-4.8L1 10"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Inbox Panel -->
    <div class="inbox-panel">
      <div class="inbox-header">
        <div class="inbox-title">
          Inbox
          <span class="badge" id="unreadBadge">0</span>
        </div>
        <div class="refresh-info" id="refreshInfo">—</div>
      </div>
      <div class="message-list" id="messageList">
        <div class="empty-state">
          <div class="empty-icon">⌛</div>
          <p>Setting up your inbox...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Message Viewer -->
<div class="message-viewer" id="messageViewer">
  <div class="viewer-header">
    <button class="btn" onclick="closeViewer()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <div class="viewer-meta">
      <div class="viewer-subject" id="viewerSubject"></div>
      <div class="viewer-from" id="viewerFrom"></div>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API = 'https://api.mail.tm';
let state = {
  address: null,
  password: null,
  token: null,
  messages: [],
  polling: null,
};

// ── Utils ──────────────────────────────────────────────

function rand(len = 10) {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 3000);
}

function setStatus(live) {
  document.getElementById('statusDot').className = 'status-dot' + (live ? ' live' : '');
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}

// ── Persist session ────────────────────────────────────

function saveSession() {
  try {
    sessionStorage.setItem('bm_session', JSON.stringify({
      address: state.address,
      password: state.password,
      token: state.token
    }));
  } catch(e) {}
}

function loadSession() {
  try {
    const s = sessionStorage.getItem('bm_session');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return null;
}

// ── API calls ──────────────────────────────────────────

async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err['hydra:description'] || err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function getDomains() {
  const data = await apiFetch('/domains?page=1');
  const domains = data['hydra:member'];
  if (!domains || domains.length === 0) throw new Error('No domains available');
  return domains;
}

async function createAccount(address, password) {
  return apiFetch('/accounts', {
    method: 'POST',
    body: JSON.stringify({ address, password })
  });
}

async function getToken(address, password) {
  return apiFetch('/token', {
    method: 'POST',
    body: JSON.stringify({ address, password })
  });
}

async function getMessages() {
  const data = await apiFetch('/messages?page=1');
  return data['hydra:member'] || [];
}

async function getMessage(id) {
  return apiFetch('/messages/' + id);
}

async function markRead(id) {
  try {
    await apiFetch('/messages/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/merge-patch+json' },
      body: JSON.stringify({ seen: true })
    });
  } catch(e) {}
}

// ── Core flow ──────────────────────────────────────────

async function setup() {
  // Try restore session
  const session = loadSession();
  if (session) {
    state.address = session.address;
    state.password = session.password;
    state.token = session.token;
    // Verify token still works
    try {
      await getMessages();
      onReady();
      return;
    } catch(e) {
      // Token expired, create fresh
    }
  }
  await createNewAddress(true);
}

async function createNewAddress(silent = false) {
  stopPolling();
  setStatus(false);

  document.getElementById('emailDisplay').className = 'email-address generating';
  document.getElementById('emailDisplay').innerHTML = '<span class="spinner"></span>&nbsp; generating address...';
  document.getElementById('copyBtn').disabled = true;
  document.getElementById('newBtn').disabled = true;
  document.getElementById('refreshBtn').disabled = true;
  document.getElementById('messageList').innerHTML = `<div class="empty-state"><div class="empty-icon">⌛</div><p>Setting up your inbox...</p></div>`;

  state = { address: null, password: null, token: null, messages: [], polling: null };

  try {
    const domains = await getDomains();
    const domain = domains[Math.floor(Math.random() * domains.length)].domain;
    const address = rand(10) + '@' + domain;
    const password = rand(16);

    await createAccount(address, password);
    const tokenData = await getToken(address, password);

    state.address = address;
    state.password = password;
    state.token = tokenData.token;
    saveSession();
    onReady();
    if (!silent) toast('New address created', 'success');
  } catch(e) {
    document.getElementById('emailDisplay').textContent = 'Error — try refreshing';
    toast('Failed: ' + e.message, 'error');
  }
}

function onReady() {
  document.getElementById('emailDisplay').className = 'email-address';
  document.getElementById('emailDisplay').textContent = state.address;
  document.getElementById('copyBtn').disabled = false;
  document.getElementById('newBtn').disabled = false;
  document.getElementById('refreshBtn').disabled = false;
  setStatus(true);
  refreshInbox();
  startPolling();
}

// ── Inbox ──────────────────────────────────────────────

async function refreshInbox() {
  if (!state.token) return;
  try {
    const msgs = await getMessages();
    state.messages = msgs;
    renderMessages();
    document.getElementById('refreshInfo').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('refreshInfo').textContent = 'Refresh failed';
  }
}

function renderMessages() {
  const list = document.getElementById('messageList');
  const unread = state.messages.filter(m => !m.seen).length;
  const badge = document.getElementById('unreadBadge');
  badge.textContent = unread;
  badge.className = 'badge' + (unread > 0 ? ' visible' : '');

  if (state.messages.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>No messages yet.<br>Send an email to your address above.</p></div>`;
    return;
  }

  list.innerHTML = state.messages.map(m => `
    <div class="message-item ${m.seen ? '' : 'unread'}" onclick="openMessage('${m.id}')">
      <div class="msg-from">${escHtml(m.from?.address || 'Unknown sender')}</div>
      <div class="msg-time">${formatTime(m.createdAt)}</div>
      <div class="msg-subject">${escHtml(m.subject || '(no subject)')}</div>
    </div>
  `).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Message viewer ─────────────────────────────────────

async function openMessage(id) {
  try {
    const msg = await getMessage(id);
    await markRead(id);
    // Update local seen state
    const local = state.messages.find(m => m.id === id);
    if (local) local.seen = true;
    renderMessages();

    document.getElementById('viewerSubject').textContent = msg.subject || '(no subject)';
    document.getElementById('viewerFrom').textContent = 'From: ' + (msg.from?.address || 'Unknown');

    const body = document.getElementById('viewerBody');
    if (msg.html && msg.html.length > 0) {
      const iframe = document.createElement('iframe');
      iframe.sandbox = 'allow-same-origin';
      iframe.style.cssText = 'width:100%;border:none;min-height:400px;background:white;border-radius:8px;';
      body.innerHTML = '';
      body.appendChild(iframe);
      iframe.contentDocument.open();
      iframe.contentDocument.write(msg.html.join ? msg.html.join('') : msg.html);
      iframe.contentDocument.close();
      // Auto-resize
      setTimeout(() => {
        try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 40 + 'px'; } catch(e) {}
      }, 200);
    } else {
      body.innerHTML = '<pre>' + escHtml(msg.text || '(empty message)') + '</pre>';
    }

    document.getElementById('messageViewer').className = 'message-viewer active';
  } catch(e) {
    toast('Could not load message: ' + e.message, 'error');
  }
}

function closeViewer() {
  document.getElementById('messageViewer').className = 'message-viewer';
}

// ── Polling ────────────────────────────────────────────

function startPolling() {
  stopPolling();
  state.polling = setInterval(refreshInbox, 15000); // every 15s
}

function stopPolling() {
  if (state.polling) { clearInterval(state.polling); state.polling = null; }
}

// ── Actions ────────────────────────────────────────────

async function copyAddress() {
  if (!state.address) return;
  try {
    await navigator.clipboard.writeText(state.address);
    toast('Copied!', 'success');
  } catch(e) {
    // Fallback
    const el = document.createElement('input');
    el.value = state.address;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    toast('Copied!', 'success');
  }
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
});

// Pause polling when tab hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPolling();
  else if (state.token) startPolling();
});

// Boot
setup();
</script>
</body>
</html>
